<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 机器人头部 -->
  <rect x="50" y="40" width="100" height="90" rx="20" fill="#6A11CB" />
  
  <!-- 机器人眼睛 -->
  <circle cx="80" cy="70" r="12" fill="white" />
  <circle cx="120" cy="70" r="12" fill="white" />
  <circle cx="80" cy="70" r="6" fill="#2575FC" />
  <circle cx="120" cy="70" r="6" fill="#2575FC" />
  
  <!-- 机器人天线 -->
  <line x1="80" y1="40" x2="70" y2="25" stroke="#2575FC" stroke-width="4" stroke-linecap="round" />
  <circle cx="70" cy="20" r="6" fill="#2575FC" />
  
  <!-- 机器人嘴巴 -->
  <path d="M70 100 Q100 120 130 100" stroke="white" stroke-width="4" stroke-linecap="round" />
  
  <!-- 机器人身体 -->
  <rect x="65" y="130" width="70" height="50" rx="10" fill="#4B6CB7" />
  
  <!-- 机器人手臂 -->
  <rect x="30" y="140" width="35" height="10" rx="5" fill="#4B6CB7" />
  <rect x="135" y="140" width="35" height="10" rx="5" fill="#4B6CB7" />
  
  <!-- 电路图案 -->
  <line x1="75" y1="145" x2="95" y2="145" stroke="white" stroke-width="2" />
  <line x1="105" y1="145" x2="125" y2="145" stroke="white" stroke-width="2" />
  <line x1="75" y1="155" x2="125" y2="155" stroke="white" stroke-width="2" />
  <line x1="85" y1="165" x2="115" y2="165" stroke="white" stroke-width="2" />
  <circle cx="95" cy="145" r="2" fill="#2575FC" />
  <circle cx="105" cy="145" r="2" fill="#2575FC" />
  <circle cx="85" cy="155" r="2" fill="#2575FC" />
  <circle cx="115" cy="155" r="2" fill="#2575FC" />
  
  <!-- 光晕效果 -->
  <circle cx="100" cy="100" r="80" fill="url(#paint0_radial)" fill-opacity="0.2" />
  
  <!-- 定义渐变 -->
  <defs>
    <radialGradient id="paint0_radial" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(100 100) rotate(90) scale(80)">
      <stop stop-color="#6A11CB" />
      <stop offset="1" stop-color="#6A11CB" stop-opacity="0" />
    </radialGradient>
  </defs>
</svg> 